name = "knight-knight-online"
main = "worker.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "Matchmaker"

# SQLite-backed Durable Objects are the kind the free plan allows
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Matchmaker"]
